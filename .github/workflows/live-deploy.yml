# Deploy the worker and run the live video suite against it.
#
# Trigger: Actions tab → "Deploy + live video tests" → Run workflow.
# (Works from a phone: no terminal needed.)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (Dashboard → My Profile → API Tokens → Create Token,
#                           "Edit Cloudflare Workers" template + R2 Storage Edit)
#   CLOUDFLARE_ACCOUNT_ID  (Dashboard → Workers & Pages → Account ID)
#
# Live-suite fixture: the direct-MP4 live tests need a small public MP4 that the
# *Worker* (Cloudflare egress, not the runner) can fetch. This workflow publishes
# tests/fixtures/live-public-video.mp4 to a dedicated public R2 bucket
# (demo-mcp-live-fixtures, r2.dev URL) and exports it as LIVE_PUBLIC_VIDEO_URL;
# a preflight step asks the deployed Worker whether it can reach it. If either
# step fails, the suite falls back to the default in tests/helpers/live.ts and
# a denied fixture becomes an explicit, labelled ENVIRONMENT SKIP — never a
# silent pass.
name: Deploy + live video tests

on:
  # A merge to main is the release: typecheck + the full offline suite gate the
  # deploy step below, so a broken tree cannot reach production. Remove this
  # trigger if you prefer to release by hand from the Actions tab.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_live:
        description: "Deploy only, skip the live test suite"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: the Worker's DEMO_API_KEY, used only to seed the Build Your Own
      # X catalog through the administrator route below. When the secret is not
      # configured the step is skipped with a notice instead of failing.
      DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Offline suite (gate the deploy on it)
        run: npm test

      - name: Audit deployed MCP code and binding names (no secret values)
        run: node scripts/audit-mcp-deployment.mjs

      - name: Ensure R2 bucket exists
        run: npx wrangler r2 bucket create demo-mcp-screenshots || echo "bucket already exists (continuing)"

      - name: Deploy to Cloudflare
        id: deploy
        run: |
          # `pipefail` is load-bearing. GitHub's default shell for `run:` steps is
          # `bash -e` WITHOUT pipefail, so `wrangler deploy | tee` used to swallow a
          # failed deploy: on 2026-10-01 (run 36906701794) this step reported success
          # while no version ID was printed and the Worker kept answering the
          # previous release. A deploy that did not happen must fail the job.
          set -o pipefail
          set +e
          npx wrangler deploy --keep-vars 2>&1 | tee deploy.log
          DEPLOY_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$DEPLOY_STATUS" -ne 0 ]; then
            # Annotations are single-line and truncate, so the cause has to be
            # flattened here: without it the run UI says only "deploy failed" and
            # the reason stays buried in a log the API may not serve to a client.
            # wrangler colourises even through a pipe, so strip ANSI and \r first.
            STRIP='s/\x1b\[[0-9;]*[A-Za-z]//g;s/\r//g'
            BLOCK=$(sed -E "$STRIP" deploy.log | awk '/\[ERROR\]/{found=1} found' | grep -v '^[[:space:]]*$' | head -n 4 | tr '\n' '|' | tr -s ' ' | cut -c1-500)
            TAIL=$(sed -E "$STRIP" deploy.log | grep -v '^[[:space:]]*$' | tail -n 3 | tr '\n' '|' | tr -s ' ' | cut -c1-300)
            EXCERPT=$(printf '[error] %s [tail] %s' "${BLOCK:-none}" "${TAIL:-none}")
            echo "::error title=Deploy failed::wrangler deploy exited ${DEPLOY_STATUS}: ${EXCERPT//%/%25}"
            tail -n 25 deploy.log
            exit 1
          fi
          URL=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$URL" ]; then
            echo "::error title=Deploy output unreadable::No workers.dev URL in the deploy output."
            tail -n 20 deploy.log
            exit 1
          fi
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          VERSION=$(sed -n 's/.*Current Version ID: //p' deploy.log | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error title=Deploy did not report a version::wrangler printed no 'Current Version ID', so the upload did not land. Last lines:"
            tail -n 20 deploy.log
            exit 1
          fi
          echo "Deployed to $URL (version $VERSION)"
          echo "::notice title=Worker deployment::URL=$URL version=$VERSION"

      # A green deploy step is not proof of a release: it only means wrangler exited
      # 0. This asks the deployment itself, the same way tests/mcp-tools.test.ts asks
      # the code, so "the new version is live" is an observed fact rather than an
      # inference from a log line.
      - name: Verify the deployed version matches package.json
        run: |
          EXPECTED=$(node -p 'require("./package.json").version')
          URL='${{ steps.deploy.outputs.worker_url }}'
          for attempt in $(seq 1 6); do
            ACTUAL=$(node -e 'fetch(process.argv[1]).then((r) => r.json()).then((j) => process.stdout.write(String(j.version ?? ""))).catch(() => process.stdout.write(""))' "$URL/health?expect=$EXPECTED-$RANDOM")
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "::notice title=Live version::/health reports $ACTUAL, matching package.json"
              exit 0
            fi
            echo "attempt $attempt/6: /health reports '${ACTUAL:-<none>}', expected $EXPECTED — retrying in 5s"
            sleep 5
          done
          echo "::error title=Stale deployment::the Worker still does not report $EXPECTED after the deploy. The deploy did not take effect."
          exit 1

      - name: Verify unauthenticated MCP handshake and ping
        run: node scripts/verify-mcp.mjs '${{ steps.deploy.outputs.worker_url }}'

      # Deployment-side email check. Prints the secret NAMES bound to this Worker
      # (values are never printed by wrangler and never logged here) and the live
      # emailDelivery report, so "the secret is set but the Worker says it is not"
      # is visible in the run log instead of only on the sign-up page.
      # Seed or refresh the Build Your Own X catalog. The index is
      # administrator-only by design (the key travels in a header, never a query
      # string), incremental (ETag/If-None-Match, then a SHA-256 comparison) and
      # debounced by BYOX_REFRESH_MIN_INTERVAL_SECONDS, so a second deploy within
      # the interval reports "unchanged" instead of re-fetching the README.
      - name: Seed the Build Your Own X catalog
        if: env.DEMO_API_KEY != ''
        run: |
          set -euo pipefail
          URL='${{ steps.deploy.outputs.worker_url }}'
          CODE=$(curl -sS -o refresh.json -w '%{http_code}' -X POST "$URL/byox/refresh" \
            -H "x-demo-admin-key: $DEMO_API_KEY" -H 'accept: application/json')
          echo "POST /byox/refresh -> HTTP $CODE"
          node -e 'const r=require("./refresh.json");console.log(JSON.stringify({refreshed:r.refresh?.refreshed??null,unchanged:r.refresh?.unchanged??null,entries:r.refresh?.counts?.tutorials??null,stale:r.refresh?.stale??null,reason:r.refresh?.reason??null,error:r.error??null}))'
          if [ "$CODE" != "200" ]; then echo "Catalog refresh was refused (HTTP $CODE)"; exit 1; fi
          rm -f refresh.json

      - name: Catalog seeding skipped (no DEMO_API_KEY secret)
        if: env.DEMO_API_KEY == ''
        run: |
          echo "::notice ::DEMO_API_KEY is not configured as a repository secret, so the Build Your Own X catalog was not seeded. An operator can seed it with: curl -X POST <worker-url>/byox/refresh -H \"x-demo-admin-key: \$DEMO_API_KEY\""

      - name: Report account-email delivery status (names only, never values)
        run: |
          echo "Secrets bound to this Worker (names only):"
          npx wrangler secret list || echo "(could not list secrets — the token needs Workers:Edit)"
          echo
          echo "Live email delivery status:"
          curl -sS '${{ steps.deploy.outputs.worker_url }}/account/session' || true
          echo

      - name: Apply video-artifacts lifecycle rule
        run: >
          npx wrangler r2 bucket lifecycle add demo-mcp-screenshots
          demo-video-artifacts-expiry "video-artifacts/" --expire-days 2
          || echo "rule already exists (continuing)"

      - name: Publish the live-test video fixture to R2 (public r2.dev URL)
        id: fixture
        if: inputs.skip_live != 'true'
        run: |
          BUCKET=demo-mcp-live-fixtures
          FILE=tests/fixtures/live-public-video.mp4
          KEY="live-fixtures/demo-live-public-video-$(sha256sum "$FILE" | cut -c1-16).mp4"
          # No output is written on failure: an unset step output is an empty
          # string, which makes tests/helpers/live.ts fall back to its default.
          npx wrangler r2 bucket create "$BUCKET" || echo "bucket already exists (continuing)"
          npx wrangler r2 bucket dev-url enable "$BUCKET" --force || echo "could not enable the r2.dev URL (continuing)"
          PUBLIC=$(npx wrangler r2 bucket dev-url get "$BUCKET" 2>&1 | grep -oE 'https://pub-[a-z0-9]+\.r2\.dev' | head -n 1)
          if [ -z "$PUBLIC" ]; then
            echo "::warning title=Live fixture not published::No public r2.dev URL for bucket $BUCKET. The live suite falls back to the default fixture in tests/helpers/live.ts; if the Worker cannot reach that one, the direct-MP4 tests report an explicit ENVIRONMENT SKIP."
            exit 0
          fi
          if npx wrangler r2 object put "$BUCKET/$KEY" --file "$FILE" --content-type video/mp4 --cache-control "public, max-age=86400" --remote; then
            echo "url=$PUBLIC/$KEY" >> "$GITHUB_OUTPUT"
            echo "Published $FILE ($(stat -c %s "$FILE") bytes) as $PUBLIC/$KEY"
          else
            echo "::warning title=Live fixture not published::Upload to $BUCKET failed. The live suite falls back to the default fixture in tests/helpers/live.ts; if the Worker cannot reach that one, the direct-MP4 tests report an explicit ENVIRONMENT SKIP."
          fi

      - name: Preflight — can the Worker reach the live fixture?
        if: inputs.skip_live != 'true'
        env:
          FIXTURE_URL: ${{ steps.fixture.outputs.url }}
        run: |
          if [ -z "$FIXTURE_URL" ]; then
            FIXTURE_URL=$(grep -oE 'DEFAULT_PUBLIC_VIDEO_URL = "[^"]+"' tests/helpers/live.ts | cut -d'"' -f2)
            echo "Using the default fixture from tests/helpers/live.ts: $FIXTURE_URL"
          fi
          node scripts/probe-live-fixture.mjs '${{ steps.deploy.outputs.worker_url }}' "$FIXTURE_URL"

      - name: Live video suite (15 tests)
        if: inputs.skip_live != 'true'
        env:
          LIVE_PUBLIC_VIDEO_URL: ${{ steps.fixture.outputs.url }}
        run: DEMO_MCP_LIVE=1 LIVE_WORKER_URL='${{ steps.deploy.outputs.worker_url }}' npm run test:live:video

      - name: Summary
        if: always()
        run: |
          echo "## Deploy + live video tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: ${{ steps.deploy.outputs.worker_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Capabilities: ${{ steps.deploy.outputs.worker_url }}/capabilities/video" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: ${{ steps.deploy.outputs.worker_url }}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "Live fixture (LIVE_PUBLIC_VIDEO_URL): ${{ steps.fixture.outputs.url || 'not published — default from tests/helpers/live.ts' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Live-suite skips are always labelled: a fixture the Worker cannot reach prints an \"ENVIRONMENT SKIP (fixture host denied the Worker)\" note in the suite log; nothing passes silently." >> "$GITHUB_STEP_SUMMARY"
